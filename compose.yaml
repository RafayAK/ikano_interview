services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ikano_onboarding
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ikano_onboarding"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    init: true
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/ikano_onboarding
      APP_CORS_ALLOW_ORIGINS: '["http://localhost:${FRONTEND_PORT:-4321}"]'
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app:ro,z
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build: ./frontend
    init: true
    environment:
      PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}/api/v1
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4321}:4321"
    volumes:
      - ./frontend/src:/app/src:ro,z
      - ./frontend/public:/app/public:ro,z
      - ./frontend/astro.config.mjs:/app/astro.config.mjs:ro,z
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4321').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
